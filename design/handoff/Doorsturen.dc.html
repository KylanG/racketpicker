<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Je wordt doorgestuurd | Racketpicker</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#033A19;font-family:'Outfit',sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
a{color:#fff;text-decoration:none}
*{box-sizing:border-box}
:focus-visible{outline:3px solid #fff;outline-offset:2px;box-shadow:0 0 0 6px #C8E63A}
</style>
<script src="reveal.js"></script>
</helmet>
<main id="main" style="min-height:100vh;background:radial-gradient(ellipse 70% 80% at 50% 40%, #07602A 0%, #04471F 60%, #033A19 100%);display:grid;place-items:center;padding:40px 20px">
  <div data-reveal="" style="width:100%;max-width:480px;display:flex;flex-direction:column;align-items:center;gap:28px;text-align:center">
    <a href="Homepagina.dc.html" aria-label="Racketpicker, naar de homepagina"><img src="assets/logo.svg" alt="" width="95" height="40" style="display:block;height:48px;width:auto"></a>
    <div style="display:flex;flex-direction:column;gap:10px">
      <h1 style="margin:0;font-weight:600;font-size:clamp(26px,3vw,34px);letter-spacing:-.3px" role="status">{{ heading }}</h1>
      <p style="margin:0;font-size:16px;line-height:1.5;color:#D3E3D7">{{ sub }}</p>
    </div>
    <div style="width:100%;height:4px;background:rgba(255,255,255,.18)" aria-hidden="true"><div style="height:100%;width:{{ progress }};background:#C8E63A;transition:width 2.4s cubic-bezier(.22,1,.36,1)"></div></div>
    <sc-if value="{{ done }}">
      <div data-reveal="" style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">
        <a href="javascript:history.back()" style="min-height:48px;display:flex;align-items:center;padding:0 22px;background:rgba(255,255,255,.12);font-weight:600;font-size:15px;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)">Terug naar Racketpicker</a>
        <a href="Rackets.dc.html" style="min-height:48px;display:flex;align-items:center;padding:0 22px;background:#C8E63A;color:#033A19;font-weight:600;font-size:15px">Verder vergelijken</a>
      </div>
    </sc-if>
  </div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { shop: 'de winkel', go: false, done: false };
  componentDidMount() {
    const s = decodeURIComponent(location.hash.slice(1));
    this.setState({ shop: s || 'de winkel' });
    requestAnimationFrame(() => requestAnimationFrame(() => this.setState({ go: true })));
    this.t = setTimeout(() => this.setState({ done: true }), 2600);
  }
  componentWillUnmount() { clearTimeout(this.t); }
  renderVals() {
    const s = this.state;
    return {
      heading: s.done ? `Hier zou ${s.shop} openen` : `Je gaat naar ${s.shop}`,
      sub: s.done ? 'Dit is een prototype. Op de live site kom je nu op de productpagina van de winkel.' : 'De prijs en voorraad kunnen bij de winkel afwijken van wat wij tonen.',
      progress: s.go ? '100%' : '0%', done: s.done
    };
  }
}
</script>
</body>
</html>
